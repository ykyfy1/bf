name: Hebing
permissions:
  contents: write
on:
  #schedule:
    #- cron: "0 20 * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl openssl || true
          openssl version

      - name: 执行合并脚本
        env:
          M3U_HOST1: ${{ secrets.M3U_HOST1 }}
          M3U_USER1: ${{ secrets.M3U_USER1 }}
          M3U_PASS1: ${{ secrets.M3U_PASS1 }}
          M3U_HOST2: ${{ secrets.M3U_HOST2 }}
          M3U_USER2: ${{ secrets.M3U_USER2 }}
          M3U_PASS2: ${{ secrets.M3U_PASS2 }}
          ENCRYPT_PASS: ${{ secrets.ENCRYPT_PASS }}
        run: |
          sed -i 's/\r$//' Hebing.sh
          chmod +x Hebing.sh
          ./Hebing.sh

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # 重点：部署dist目录，不是根目录！和采集仓库保持一致
          command: pages deploy dist --project-name=hb
