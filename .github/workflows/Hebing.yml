name: Hebing
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 安装python依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y sed curl
          python -m pip install requests

      - name: 执行Python合并脚本
        env:
          M3U_URL_LIST: ${{ secrets.M3U_URL_LIST }}
          BASIC_USER: ${{ secrets.BASIC_USER }}
          BASIC_PASS: ${{ secrets.BASIC_PASS }}
        run: |
          python3 merge.py
          mkdir -p dist
          cp zubo.m3u dist/
          RAW="${BASIC_USER}:${BASIC_PASS}"
          B64=$(echo -n "$RAW" | base64)
          cat > dist/_middleware.js <<'EOF'
export async function onRequest({ request, next }) {
  const auth = request.headers.get('authorization') || '';
  const validAuth = "Basic __B64__";
  if (auth !== validAuth) {
    return new Response('Unauthorized', {
      status: 401,
      headers: {
        'WWW-Authenticate': 'Basic realm="Access"',
        'Cache-Control': 'no-store, no-cache, must-revalidate'
      }
    })
  }
  return await next();
}
EOF
          sed -i "s|__B64__|$B64|g" dist/_middleware.js

      - name: 使用wrangler部署到Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CF_PROJECT_NAME }} --commit-dirty=true
