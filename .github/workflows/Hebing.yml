name: Hebing
permissions:
  contents: write
on:
  #schedule:
    #- cron: "01 20 * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y sed bc openssl curl tar || true

      - name: 执行多仓库合并脚本
        run: |
          chmod +x Hebing.sh
          ./Hebing.sh
        env:
          ENCRYPT_PASS: ${{ secrets.ENCRYPT_PASS }}
          ENC_URL1: ${{ secrets.ENC_URL1 }}
          ENC_URL2: ${{ secrets.ENC_URL2 }}

      - name: 安装wrangler并部署到CF Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          wrangler pages deploy ./ --project-name=iptv --branch=main
