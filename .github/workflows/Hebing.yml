name: Hebing
permissions:
  contents: write
on:
  #schedule:
    #- cron: "01 20 * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 安装系统依赖(openssl,curl等)
        run: |
          sudo apt-get update
          sudo apt-get install -y sed bc openssl curl || true

      - name: 执行合并脚本
        run: |
          sed -i 's/\r$//' Hebing.sh
          chmod +x Hebing.sh
          ./Hebing.sh
        env:
          ENC_URL1: ${{ secrets.ENC_URL1 }}
          ENC_URL2: ${{ secrets.ENC_URL2 }}
          ENCRYPT_PASS: ${{ secrets.ENCRYPT_PASS }}

      - name: 部署到CF Pages
        run: |
          npx wrangler pages deploy . --project-name=hb --branch=main
