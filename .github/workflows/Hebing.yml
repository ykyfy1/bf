name: Hebing
permissions:
  contents: write
on:
  #schedule:
    #- cron: "01 20 * * *"
  workflow_dispatch:
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 安装系统依赖(bc,sed,openssl,curl等)
        run: |
          sudo apt-get update
          sudo apt-get install -y sed bc openssl curl || true

      - name: 执行合并脚本（下载2个远端m3u，合并输出zubo.txt）
        run: |
          sed -i 's/\r$//' Hebing.sh
          chmod +x Hebing.sh
          ./Hebing.sh
        env:
          ENC_URL1: ${{ secrets.ENC_URL1 }}
          ENC_URL2: ${{ secrets.ENC_URL2 }}
          ENCRYPT_PASS: ${{ secrets.ENCRYPT_PASS }}

      # 复制明文生成 zubo.m3u 给CF部署
      - name: 准备CF部署文件
        run: |
          cp zubo.txt zubo.m3u
          echo "✅ 已生成合并后的 zubo.m3u"
          echo "<pre>IPTV源合并结果：<a href='./zubo.m3u'>zubo.m3u</a></pre>" > index.html
          echo "✅ 生成index.html兜底页面"

      # =========【和扫描仓库一模一样：先部署CF Pages】=========
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy . --project-name=hb

      # =========【部署完成后，再加密生成zubo.enc】=========
      - name: 加密zubo.txt生成zubo.enc
        run: |
          log_print() { echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"; }
          if [ -f "zubo.txt" ] && [ -s "zubo.txt" ]; then
            log_print "检测到zubo.txt，开始加密生成 zubo.enc"
            openssl enc -aes-256-cbc -salt -in zubo.txt -out zubo.enc -k "$ENCRYPT_PASS"
            if [ $? -eq 0 ] && [ -f "zubo.enc" ] && [ -s "zubo.enc" ]; then
              log_print "✅ 加密成功，删除明文 zubo.txt"
              rm -f zubo.txt
            else
              log_print "❌ 加密失败，保留明文zubo.txt用于排查问题"
            fi
          else
            log_print "zubo.txt 文件为空或不存在，跳过加密，不生成zubo.enc"
          fi
        env:
          ENCRYPT_PASS: ${{ secrets.ENCRYPT_PASS }}

      # 提交加密文件回Github仓库（zubo.enc保存到github，不保存明文）
      - name: 提交加密文件回仓库
        run: |
          cd $GITHUB_WORKSPACE
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git reset HEAD .
          if [[ -n $(git status --porcelain zubo.enc) ]]; then
            echo "✅ 检测zubo.enc更新，提交回仓库"
            git add zubo.enc
            git commit -m "🤖 合并脚本自动更新 zubo.enc ${{ github.run_id }}"
            git push
          else
            echo "ℹ️ zubo.enc无变更，跳过提交"
          fi
